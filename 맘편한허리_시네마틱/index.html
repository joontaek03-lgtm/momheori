<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="출산예정일·체력·운동 습관을 입력하면 임산부에게 맞는 요통 운동 프로그램을 만들어 주는 웹페이지">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>맘편한 허리 프로젝트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 홈(히어로, 진행 방식, 질문 목록, 통계, 시기별 카드, 알아두기, 중단 신호) + 맞춤 프로그램(입력 → 결과) ↔ 세부 화면, 시기별 색으로 구분 */
:root{
  --bg:#FBF8F4; --surface:#FFFFFF; --fg:#1F2A28; --muted:#5A6662; --line:#E7E1D9; --hover:#EFE9E1; --tint:#F4EEE7;
  --ink:#1F2A28; --ink-fg:#F3EFE9; --ink-muted:#B7B0A6; --ink-num:#F7B98F;
  --hl:#F5C9A8; --on-c:#FFFFFF; --glass:rgba(251,248,244,.9);
  --early:#2E7A6A; --early-soft:#DCEEE7; --early-dark:#1F5A4E; --ring:#9FCFC2;
  --mid:#B5532F; --mid-soft:#FBE4D8; --mid-dark:#8E3B1E;
  --late:#4F5BA8; --late-soft:#E3E6F7; --late-dark:#3A4486;
  --danger:#B4473A; --danger-soft:#F8E0DB; --danger-dark:#8E2F24; --danger-line:#F0C9C1;
  --shadow:rgba(31,42,40,.12);
  --qz-bg1:#EEE8F8; --qz-bg2:#F9DDEB; --qz-bar:#E8458B; --qz-bar-dark:#C42F6F; --qz-line:#CFC8D6; --qz-sel:#E4ECFF; --qz-sel-line:#5B7FE8;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131A19; --surface:#1B2422; --fg:#E8EEEC; --muted:#A3B2AE; --line:#2C3836; --hover:#25302E; --tint:#222C2A;
  --ink:#0C1110; --ink-fg:#EDE8E1; --ink-muted:#A39C93; --ink-num:#F7B98F;
  --hl:#6B3E2A; --on-c:#0E1413; --glass:rgba(19,26,25,.88);
  --early:#5FBFA9; --early-soft:#1C3530; --early-dark:#91D8C6; --ring:#3E7D6F;
  --mid:#E38A66; --mid-soft:#3A251C; --mid-dark:#F4B297;
  --late:#909AE2; --late-soft:#252A47; --late-dark:#BAC1F2;
  --danger:#F08A7C; --danger-soft:#3D2220; --danger-dark:#F6ADA2; --danger-line:#5A2E2A;
  --qz-bg1:#1C1824; --qz-bg2:#2C1A27; --qz-bar:#C2386F; --qz-bar-dark:#97295A; --qz-line:#3E3848; --qz-sel:#232C47; --qz-sel-line:#8DA2F5;
  --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131A19; --surface:#1B2422; --fg:#E8EEEC; --muted:#A3B2AE; --line:#2C3836; --hover:#25302E; --tint:#222C2A;
  --ink:#0C1110; --ink-fg:#EDE8E1; --ink-muted:#A39C93; --ink-num:#F7B98F;
  --hl:#6B3E2A; --on-c:#0E1413; --glass:rgba(19,26,25,.88);
  --early:#5FBFA9; --early-soft:#1C3530; --early-dark:#91D8C6; --ring:#3E7D6F;
  --mid:#E38A66; --mid-soft:#3A251C; --mid-dark:#F4B297;
  --late:#909AE2; --late-soft:#252A47; --late-dark:#BAC1F2;
  --danger:#F08A7C; --danger-soft:#3D2220; --danger-dark:#F6ADA2; --danger-line:#5A2E2A;
  --qz-bg1:#1C1824; --qz-bg2:#2C1A27; --qz-bar:#C2386F; --qz-bar-dark:#97295A; --qz-line:#3E3848; --qz-sel:#232C47; --qz-sel-line:#8DA2F5;
  --shadow:rgba(0,0,0,.4); color-scheme:dark}

.t-early{--c:var(--early);--soft:var(--early-soft);--dark:var(--early-dark)}
.t-mid{--c:var(--mid);--soft:var(--mid-soft);--dark:var(--mid-dark)}
.t-late{--c:var(--late);--soft:var(--late-soft);--dark:var(--late-dark)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.75;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0} ul,ol{margin:0;padding:0}
.disp{font-family:var(--display);font-weight:700}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--early)}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--early)}
:focus-visible{outline:3px solid var(--early);outline-offset:3px;border-radius:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;min-height:44px}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--early);display:grid;place-items:center;color:var(--on-c)}
.brand b{font-size:19px}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.pill{background:none;border:0;border-radius:999px;padding:6px 14px;min-height:40px;font-size:15px;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
.pill:hover{background:var(--hover);color:var(--fg)}
.pill.on{background:var(--fg);color:var(--bg)}
/* 사이트 메뉴: 어두운 배경 (홈 / 소개 / 문의) */
.site-nav{background:var(--ink);color:#fff}
.site-nav .wrap{display:flex;justify-content:flex-end;gap:4px;height:40px;align-items:center}
.site-nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;opacity:.82;transition:opacity .2s,background .2s}
.site-nav a:hover{opacity:1;background:rgba(255,255,255,.12)}
.site-nav a[aria-current]{opacity:1;background:rgba(255,255,255,.18);font-weight:700}
.site-nav a:focus-visible{outline-color:#fff}

/* motion */
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes breathe{0%{transform:scale(.58)}40%{transform:scale(1)}100%{transform:scale(.58)}}
@keyframes inL{0%,34%{opacity:1}42%,94%{opacity:0}100%{opacity:1}}
@keyframes exL{0%,34%{opacity:0}42%,94%{opacity:1}100%{opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rvk{from{transform:translateY(36px) scale(.98)}to{transform:none}}
.a1,.a2,.a3,.a4,.a5{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.a2{animation-delay:.1s}.a3{animation-delay:.2s}.a4{animation-delay:.32s}.a5{animation-delay:.45s}
.view-in{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline: view()){
  .rv{animation:rvk linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
}

/* hero */
.hero{padding-block:64px 44px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5.6vw,3.8rem);letter-spacing:-.01em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--early);position:relative;white-space:nowrap;display:inline-block}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:12px;background:var(--hl);z-index:-1;transform-origin:left;animation:grow .9s .7s cubic-bezier(.2,.7,.2,1) both}
.hero h1 em span{position:relative}
.hero .t{position:relative;z-index:0}
.lead{margin-top:20px;font-size:19px;color:var(--muted);max-width:32em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;border:0;transition:transform .2s,box-shadow .2s}
.btn.pri{background:var(--c,var(--early));color:var(--on-c)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 10px 24px var(--shadow)}
.btn.sec{padding:0 24px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--fg)}
.btn svg,.go svg,.back svg{transition:transform .2s}
.btn:hover svg{transform:translateX(4px)}


/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-block:8px 88px}
.stat{background:var(--ink);color:var(--ink-fg);border-radius:22px;padding:28px;display:grid;gap:6px;align-content:start}
.stat b{font-size:clamp(2.4rem,4.5vw,3.25rem);line-height:1.05;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink-num);letter-spacing:-.02em}
.stat b small{font-size:22px;font-weight:700;color:var(--ink-muted);margin:0 6px}
.stat cite{font-size:13px;font-style:normal;color:var(--ink-muted)}

.sec{padding-bottom:96px}
.sec-h{display:grid;gap:10px;margin-bottom:32px}
.sec-h h2{font-size:clamp(1.8rem,3.6vw,2.4rem)}
.sec-h p{color:var(--muted);max-width:40em}


/* program cards */
.progs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.pcard{text-align:left;border:0;border-radius:24px;padding:28px;display:grid;gap:12px;align-content:start;background:var(--soft);color:var(--fg);transition:transform .25s,box-shadow .25s}
.pcard:hover{transform:translateY(-6px);box-shadow:0 18px 36px var(--shadow)}
.pcard .tag{justify-self:start;font-size:13px;font-weight:700;color:var(--on-c);background:var(--c);padding:4px 12px;border-radius:999px}
.pcard .big{font-size:46px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--dark)}
.pcard .big small{font-size:18px;margin-left:4px}
.pcard h3{font-size:20px}
.pcard ul{list-style:none;display:grid;gap:6px;font-size:15px}
.pcard li{display:flex;gap:8px;align-items:flex-start}
.pcard li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c);margin-top:10px}
.go{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-top:6px;color:var(--dark)}
.pcard:hover .go svg{transform:translateX(5px)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:10px;align-content:start;transition:transform .25s,border-color .25s,box-shadow .25s}
.tile:hover{transform:translateY(-5px);border-color:var(--fg);box-shadow:0 14px 30px var(--shadow)}
.tile .num{font-size:15px;font-weight:900;color:var(--mid);font-variant-numeric:tabular-nums}
.tile h3{font-size:22px}
.tile p{font-size:15px;color:var(--muted)}
.tile .ic{width:52px;height:52px;border-radius:16px;background:var(--tint);display:grid;place-items:center;animation:float 4s ease-in-out infinite}
.tile:nth-child(2) .ic{animation-delay:.6s}.tile:nth-child(3) .ic{animation-delay:1.2s}

/* stop */
.stop{background:var(--danger-soft);border-radius:28px;padding:32px 36px;display:grid;gap:20px}
.stop-h{display:flex;gap:14px;align-items:center}
.stop-ic{position:relative;width:48px;height:48px;border-radius:50%;background:var(--danger);color:var(--on-c);display:grid;place-items:center;flex:none}
.stop-ic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--danger);animation:ring 2.4s ease-out infinite}
.stop h3{font-size:22px;color:var(--danger-dark)}
.stop-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;list-style:none}
.stop-list li{background:var(--surface);border-radius:14px;padding:14px 16px;font-size:15px;font-weight:500}
.stop .small{font-size:14px;color:var(--danger-dark)}

.refs{border-top:1px solid var(--line);padding-block:24px 64px}
.refs summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--muted);min-height:44px;display:flex;align-items:center}
.refs ol{padding-left:1.4em;display:grid;gap:6px;font-size:14px;color:var(--muted);overflow-wrap:anywhere;margin-top:12px}
footer{background:var(--ink);color:var(--ink-muted);padding-block:36px;font-size:14px}
footer .wrap{display:grid;gap:6px}
footer b{color:var(--ink-fg)}

/* detail */
.d-hero{padding-block:40px 44px;border-radius:0 0 40px 40px;background:var(--soft)}
.back{background:none;border:0;padding:0;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.back:hover svg{transform:translateX(-4px)}
.d-hero .eyebrow{color:var(--dark);margin-top:16px}
.d-hero h1{font-size:clamp(2rem,4.6vw,3rem);margin-top:10px}
.d-hero .lead{font-size:18px;color:var(--fg);opacity:.85}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.d-weeks{font-size:clamp(4rem,9vw,6rem);line-height:1;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--c)}
.d-weeks small{font-size:28px;margin-left:6px}
.d-body{padding-block:56px 40px;display:grid;gap:72px}
.blk{display:grid;gap:22px;min-width:0}
.blk > h2{font-size:clamp(1.5rem,3vw,1.9rem)}
.blk > p.intro{color:var(--muted);max-width:42em;margin-top:-8px}
.g2,.g3{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;display:grid;gap:10px;align-content:start;min-width:0;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px var(--shadow)}
.card h3{font-size:19px}
.card p,.card li{font-size:16px}
.card ul{padding-left:1.15em;display:grid;gap:6px}
.card .src{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.card.avoid{border-color:var(--danger-line)}
.card.avoid h3{color:var(--danger-dark)}
.fno{font-size:40px;line-height:1;font-weight:900;color:var(--mid);opacity:.35}
.bal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bal > div{border-radius:20px;padding:26px;display:grid;gap:12px;align-content:start;background:var(--soft)}
.bal h3{font-size:22px}
.bal .tg{justify-self:start;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--surface);color:var(--dark)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:16px;font-weight:500;padding:6px 14px;border-radius:999px;background:var(--surface)}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:16px}
.bar{display:grid;grid-template-columns:6em minmax(0,1fr) 4em;align-items:center;gap:14px;font-size:16px}
.bar .tr{height:22px;background:var(--tint);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:var(--mid);transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
.bar:nth-child(2) .fill{animation-delay:.12s}.bar:nth-child(3) .fill{animation-delay:.24s}.bar:nth-child(4) .fill{animation-delay:.36s;background:var(--fg)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;font-size:18px}
.axis{display:grid;grid-template-columns:6em minmax(0,1fr) 4em;gap:14px;font-size:12px;color:var(--muted)}
.axis span:nth-child(2){display:flex;justify-content:space-between}
.note{border-radius:20px;padding:24px 26px;display:grid;gap:10px;font-size:16px;background:var(--soft)}
.note ul{padding-left:1.15em;display:grid;gap:6px}
.note h3{font-size:19px;color:var(--dark)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;font-size:16px}
.tbl th,.tbl td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);background:var(--bg)}
.tbl th.t-early,.tbl th.t-mid,.tbl th.t-late{color:var(--dark)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:700}
.tbl tbody tr{transition:background .2s}
.tbl tbody tr:hover{background:var(--bg)}
.st{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--early-soft);color:var(--early-dark)}
.st.cau{background:var(--mid-soft);color:var(--mid-dark)}
.st.no{background:var(--danger-soft);color:var(--danger-dark)}
.sub{display:block;font-size:13px;color:var(--muted);margin-top:4px}

.ov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:32px 0 0}
.ov > div{background:var(--surface);border-radius:18px;padding:18px 20px;display:grid;gap:4px;min-width:0}
.ov dt{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.ov dd{margin:0;font-weight:700;font-size:16px}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 105px);z-index:10;display:flex;gap:8px;flex-wrap:wrap;padding-block:12px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.subnav a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);font-weight:700;font-size:15px;transition:border-color .2s}
.subnav a:hover{border-color:var(--fg)}
.subnav i{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.ph{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ph-sec{scroll-margin-top:150px}
.ph h2{font-size:clamp(1.5rem,3vw,1.9rem)}
.ph .tm{font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;color:var(--on-c);background:var(--c)}
.ph .d{font-size:16px;color:var(--muted)}
.exg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:18px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:16px;align-content:start;min-width:0;transition:transform .25s,box-shadow .25s}
.ex:hover{transform:translateY(-4px);box-shadow:0 16px 32px var(--shadow)}
.ex-top{display:flex;gap:14px;align-items:flex-start}
.ex-no{flex:none;width:44px;height:44px;border-radius:14px;color:var(--on-c);background:var(--c);display:grid;place-items:center;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.ex-goal{font-size:13px;font-weight:700;color:var(--dark)}
.ex h3{font-size:21px}
.ex-media{aspect-ratio:16/9;max-width:100%;border-radius:14px;display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--dark);background:var(--soft)}
.ex-meta{display:flex;flex-wrap:wrap;gap:8px}
.ex-meta span{font-size:14px;font-weight:500;padding:5px 12px;border-radius:10px;background:var(--tint)}
.steps{list-style:none;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:16px;line-height:1.65}
.sn{width:28px;height:28px;border-radius:50%;border:2px solid var(--fg);display:grid;place-items:center;font-size:13px;font-weight:900;margin-top:1px}
.lv{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:14px}
.lv div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;font-size:15px;align-items:start}
.lv i{font-style:normal;font-size:12px;font-weight:700;padding:3px 0;border-radius:8px;text-align:center}
.lv .e i{background:var(--early-soft);color:var(--early-dark)}
.lv .h i{background:var(--mid-soft);color:var(--mid-dark)}
.caut{font-size:15px;font-weight:500;color:var(--danger-dark);background:var(--danger-soft);border-radius:12px;padding:10px 14px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:28px 72px;border-top:1px solid var(--line)}
.pager button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 22px;min-height:52px;font-weight:700;transition:border-color .2s,transform .2s}
.pager button:hover{border-color:var(--fg);transform:translateY(-2px)}

/* home: 예시 카드 · 진행 방식 · 질문 목록 */
.hero-note{margin-top:14px;font-size:14px;color:var(--muted)}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;display:grid;gap:14px;box-shadow:0 24px 48px var(--shadow)}
.mock-k{font-size:13px;font-weight:700;color:var(--mid)}
.mock h3{font-size:22px}
.mock-w{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mock-w li{aspect-ratio:1;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.mock-w li.core{background:var(--mid);color:var(--on-c)}
.mock-w li.cardio{background:var(--early);color:var(--on-c)}
.mock-l{list-style:none;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:14px}
.mock-l li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.mock-l span{color:var(--muted);text-align:right}
.how{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:10px;align-content:start}
.how-n{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:18px}
.how h3{font-size:19px;line-height:1.5}
.how p{font-size:14px;color:var(--muted)}
.ask{background:var(--early-soft);border-radius:28px;padding:40px;display:grid;gap:24px;justify-items:start}
.ask .sec-h{margin:0}
.ask-l{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
.ask-l li{background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:2px}
.ask-l b{font-size:16px}
.ask-l span{font-size:14px;color:var(--muted)}

/* 맞춤 프로그램 입력: 전체 화면 질문 카드 (레퍼런스: 질문 앱 온보딩) */
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
body.quiz-mode .top,body.quiz-mode footer{display:none}
.qz-page{min-height:100vh;min-height:100svh;background:linear-gradient(180deg,var(--qz-bg1) 0%,var(--qz-bg1) 55%,var(--qz-bg2) 100%);display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.qz-head{display:flex;align-items:center;gap:16px;padding:14px max(16px,env(safe-area-inset-left,0px)) 6px;max-width:640px;width:100%;margin:0 auto}
.qz-head b{font-size:17px}
.qz-cancel{background:var(--surface);border:0;border-radius:999px;padding:0 18px;min-height:40px;font-size:15px;font-weight:500;box-shadow:0 2px 8px var(--shadow)}
.qz-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:14px 28px 24px;overflow:hidden}
.qz-stage::before,.qz-stage::after{content:"";position:absolute;top:44px;bottom:52px;width:min(520px,calc(100% - 56px));background:var(--surface);opacity:.55;border-radius:10px}
.qz-stage::before{right:calc(50% + min(260px,calc(50% - 28px)) + 10px)}
.qz-stage::after{left:calc(50% + min(260px,calc(50% - 28px)) + 10px)}
.qz{position:relative;z-index:1;width:100%;max-width:520px;min-height:min(560px,calc(100svh - 190px));background:var(--surface);border-radius:10px;box-shadow:0 10px 30px var(--shadow);padding:44px 24px 28px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.qz.in-r{animation:qzR .38s cubic-bezier(.2,.7,.2,1) both}
.qz.in-l{animation:qzL .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes qzR{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes qzL{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
.qz h1{font-family:var(--body);font-size:22px;font-weight:500;text-align:center}
.qz .req{font-style:normal;color:var(--qz-bar);margin-left:4px}
.qz-sub{text-align:center;color:var(--muted);font-size:16px;max-width:24em;margin:0 auto}
.qz-body{display:grid;gap:10px;margin-top:20px}
.qz-lbl{font-size:14px;font-weight:700;color:var(--muted);margin-top:8px}
.qz-hint{font-size:14px;color:var(--muted);text-align:center}
.qz-hint b{color:var(--fg)}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--qz-line);border-radius:6px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-height:48px;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--muted)}
.opt.on{background:var(--qz-sel);border-color:var(--qz-sel-line)}
.opt b{font-size:16px;font-weight:500;display:block}
.opt small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.mk{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;background:var(--surface)}
.opt.on .mk{border-color:var(--qz-sel-line)}
.opt.on .mk::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--qz-sel-line)}
.opt.ck .mk{border-radius:4px}
.opt.ck.on .mk{background:var(--qz-sel-line)}
.opt.ck.on .mk::after{width:5px;height:10px;border-radius:0;background:none;border:solid var(--surface);border-width:0 2px 2px 0;transform:translate(0,-1px) rotate(45deg)}
.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fld input{font:inherit;font-size:17px;color:var(--fg);background:var(--surface);border:1px solid var(--qz-line);border-radius:6px;padding:10px 12px;min-height:50px;width:100%;min-width:0}
.fld input:focus{outline:none;border:2px solid var(--qz-sel-line);padding:9px 11px}
.fld2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit{position:relative;display:block}
.unit i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);pointer-events:none}
.unit input{padding-right:44px}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--qz-line);border-radius:999px;padding:0 14px;min-height:38px;font-size:15px}
.chip.on{background:var(--qz-sel);border-color:var(--qz-sel-line);font-weight:700}
.qz-foot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--qz-bar);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
.qz-foot-in{max-width:640px;margin:0 auto;height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px}
.qz-arrow{background:none;border:0;color:#fff;min-width:56px;min-height:56px;display:grid;place-items:center;border-radius:12px;font-size:16px;font-weight:700}
.qz-arrow:hover{background:rgba(255,255,255,.14)}
.qz-arrow:disabled{opacity:.35;cursor:default;background:none}
.qz-arrow.done{background:#fff;color:var(--qz-bar-dark);padding:0 18px;min-height:46px;border-radius:999px}
.qz-arrow.done:disabled{background:rgba(255,255,255,.5)}
.qz-count{background:var(--qz-bar-dark);border-radius:8px;padding:10px 26px;font-size:16px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.9)}
.qz-arrow:focus-visible{outline-color:#fff}

/* 맞춤 프로그램 결과 */

.wd.cardio{background:var(--soft);border-color:var(--soft)}
.wd.rest{opacity:.6}
.rxg{display:grid;gap:12px}
.rxg h3{font-size:18px;color:var(--dark)}
.rxl{list-style:none;display:grid;gap:10px}
.rx{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.rx > div{display:grid;gap:6px;min-width:0}

.rx-m{font-size:14px;color:var(--muted)}
.rx-v{font-size:14px;border-radius:10px;padding:6px 10px;justify-self:start}
.rx-v.e{background:var(--early-soft);color:var(--early-dark)}
.rx-v.h{background:var(--mid-soft);color:var(--mid-dark)}
.rx-v.c{background:var(--danger-soft);color:var(--danger-dark)}
.rx details summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--dark);min-height:32px;display:flex;align-items:center}
.rx details ol{padding-left:1.2em;display:grid;gap:4px;font-size:15px}
.rs-act{margin-top:0}
@media print{
  .top,footer,.rs-act,.back,.pager{display:none!important}

}

  .ask-l{grid-template-columns:repeat(2,minmax(0,1fr))}

  .d-grid{grid-template-columns:minmax(0,1fr)}
  .ov{grid-template-columns:repeat(2,minmax(0,1fr))}
}

  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  .wd{grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;padding:12px 14px}
  .stop,.ask{padding:22px}

  .wk{font-size:52px}
  .subnav{position:static}

  .pill{padding:6px 10px;font-size:14px}
  .top-in{flex-wrap:nowrap;flex-direction:column;align-items:stretch;gap:2px;padding-block:6px}

  .nav::-webkit-scrollbar{display:none}
  .pill{flex:none}
  .subnav{top:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

function gaOf(due){
  if(!due) return null;
  const d = new Date(due + 'T00:00:00'), t = new Date(); t.setHours(0,0,0,0);
  if(isNaN(d)) return null;
  const left = Math.round((d - t) / 864e5);
  return {days: 280 - left, left, wk: Math.floor((280 - left) / 7), d: (280 - left) % 7};
}
const dueOk = () => { const g = gaOf(plan.due); return !!g && g.days >= 0 && g.days <= 294; };

  const g = gaOf(plan.due); if(!g) return '예정일을 고르면 지금 주수를 알려드려요.';

  if(g.days > 294) return '예정일이 2주 넘게 지났어요. 날짜를 다시 확인해 주세요.';
  const tri = PROGS[triOf(Math.max(1, g.wk))].kicker;
  return `지금 <b>${g.wk}주 ${g.d}일</b> · ${tri} · ${g.left > 0 ? `출산까지 ${g.left}일` : '예정일이 지났어요'}`;
}

  app.innerHTML = qDone ? resultHTML() : planHTML();
  if(!qDone) renderQ();
  window.scrollTo(0, 0);
}
function renderQ(anim){
  const box = document.getElementById('qz'); if(!box) return;
  const s = STEPS[qStep], last = qStep === STEPS.length - 1;
  box.innerHTML = `<h1>${s.t}<i class="req" aria-hidden="true">*</i></h1><p class="qz-sub">${s.s}</p><div class="qz-body">${s.html()}</div>`;
  if(anim && !reduce){ box.classList.remove('in-l','in-r'); void box.offsetWidth; box.classList.add(qDir > 0 ? 'in-r' : 'in-l'); }
  document.getElementById('qz-count').textContent = `${qStep + 1} / ${STEPS.length}`;
  document.querySelector('[data-qz="prev"]').disabled = qStep === 0;
  const nx = document.querySelector('[data-qz="next"]');
  nx.innerHTML = last ? '결과 보기' : '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
  nx.classList.toggle('done', last); nx.disabled = !s.ok();
}
function refreshQ(){
  const live = document.getElementById('qz-live');
  if(live) live.innerHTML = qStep === 0 ? dueMsg() : bmiMsg();
  const nx = document.querySelector('[data-qz="next"]'); if(nx) nx.disabled = !STEPS[qStep].ok();
}
function qGo(dir){
  if(dir > 0 && !STEPS[qStep].ok()) return;
  if(dir > 0 && qStep === STEPS.length - 1){ qDone = true; renderPlan(); return; }
  const n = qStep + dir; if(n < 0 || n >= STEPS.length) return;
  qDir = dir; qStep = n; renderQ(true); window.scrollTo(0, 0);
}

/* 고른 요일 중 허리 운동 날은 최대 3일, 하루씩 띄워서 고르고 나머지는 걷기·유산소 */
function pickCore(days){
  const ds = days.map(Number).sort((a, b) => a - b), core = [];
  ds.forEach(d => { if(core.length < 3 && !core.some(c => Math.abs(c - d) === 1)) core.push(d); });
  ds.forEach(d => { if(core.length < Math.min(3, ds.length) && !core.includes(d)) core.push(d); });
  return {ds, core};
}

function buildPlan(){
  const g = gaOf(plan.due), tri = triOf(Math.max(1, g.wk)), P = PROGS[tri], bmi = bmiOf();
  const fi = FIT.findIndex(f => f[0] === plan.fit), ei = EXP.findIndex(e => e[0] === plan.exp);
  let lv = fi + ei <= 1 ? 1 : (fi + ei <= 3 ? 2 : 3);
  if(bmi >= 30 || plan.med === 'unsure') lv = Math.min(lv, 2);
  const limited = plan.med === 'yes'; if(limited) lv = 1;
  const coreMin = {15:15, 25:25, 40:30}[plan.dur];
  const cardioMin = {1:12, 2:25, 3:30}[lv], cardioTxt = {1:'10–15분',2:'20–30분',3:'30분'}[lv];
  let cardio = {low:'천천히 걷기', walk:'편한 속도로 걷기', brisk:'빠르게 걷기·실내 자전거', jog:'빠르게 걷기·실내 자전거'}[plan.fit];
  if(plan.fit === 'jog' && plan.exp === 'regular' && tri !== 'late') cardio = '가벼운 조깅 또는 빠르게 걷기';
  if(plan.kinds.includes('수영')) cardio += ' · 수영';
  const {ds, core} = pickCore(plan.days);
  const week = DAYS.map((d, i) => {
    if(core.includes(i)) return {d, k:'core', t:limited ? '호흡·스트레칭' : '허리 운동', m:limited ? '10분' : `${coreMin}분${plan.dur === '40' ? ' + 걷기 10분' : ''}`};
    if(ds.includes(i)) return limited ? {d, k:'light', t:'가볍게 움직이기', m:'스트레칭 5분'} : {d, k:'cardio', t:cardio, m:cardioTxt};
    return {d, k:'light', t:'쉬기', m:'가벼운 스트레칭 5분'};
  });
  const nCardio = ds.length - core.length;
  const total = limited ? 0 : core.length * (coreMin + (plan.dur === '40' ? 10 : 0)) + nCardio * cardioMin;
  const cut = {15:[2,2,2], 25:[3,4,3], 40:[3,99,3]}[plan.dur];
  const phases = P.phases.map((ph, i) => ({name:ph.name, items:ph.items.slice(0, cut[i])})).filter((ph, i) => !limited || i !== 1);
  const notes = [];
  if(plan.med === 'unsure') notes.push('다음 진료 때 운동해도 되는지 꼭 확인하세요. 그 전까지는 강도를 낮게 유지해요.');
  if(g.days >= 280) notes.push('예정일이 지났어요. 호흡과 가벼운 걷기 위주로 하고 담당 의사의 안내를 따르세요.');
  if(bmi >= 30) notes.push('관절 부담을 줄이도록 점프나 오래 서 있는 동작 대신 앉거나 지지하는 운동 위주로 하고, 강도는 천천히 올려요.');
  if(bmi < 18.5) notes.push('체중이 적게 늘 수 있어요. 운동량을 늘리기 전에 식사와 체중 변화를 담당 의사와 확인해요.');
  if(plan.exp === 'none') notes.push('운동이 처음이라면 쉬운 단계부터 시작하고, 다음 날 통증과 피로를 확인하며 늘려요.');
  if(plan.fit === 'jog' && tri === 'late') notes.push('후기에는 달리기 대신 빠르게 걷기나 수중 운동으로 바꾸는 것을 권해요.');
  if(ds.length <= 2) notes.push('운동하지 않는 날에도 10분씩 걷기처럼 가볍게 움직이면 허리 부담을 덜 수 있어요.');
  if(plan.goals.includes('골반저근 강화')) notes.push('골반저근 강화가 목표라면 운동하지 않는 날에도 케겔(5초 조이기 · 5초 풀기 × 10회)을 하루 2–3번 해요.');
  if(plan.goals.includes('순산 준비') && tri === 'late') notes.push('순산 준비가 목표라면 정리운동의 출산 호흡과 골반저근 이완 호흡을 매일 해 보세요.');
  if(plan.goals.includes('숙면·스트레스 관리')) notes.push('잠들기 전 복식 호흡을 5분 해 보세요. 긴장이 풀리고 잠드는 데 도움이 돼요.');
  notes.push(...P.warn.slice(0, 2));
  return {g, tri, P, lv, limited, week, total, phases, notes, coreMin};
}

function resultHTML(){
  const r = buildPlan(), L = LV[r.lv]; let k = 0;
  const dose = s => r.lv === 1 ? s.replace('× 2세트', '× 1–2세트') : s;
  const goal = r.limited ? '의사와 상의 후 정하기' : (r.total >= 150 ? `주 ${r.total}분 · 권장량 달성` : `주 약 ${r.total}분 → 150분까지`);
  return `<div class="t-${r.tri} view-in">
  <section class="d-hero"><div class="wrap">
   <button class="back" type="button" data-qz="edit">${BACK}입력 다시 하기</button>
   <p class="eyebrow a1">나의 맞춤 프로그램</p>
   <h1 class="disp a2">${r.P.kicker} · ${L.name} 단계</h1>
   <p class="lead a3">${r.g.wk}주 ${r.g.d}일${r.g.left > 0 ? `, 출산까지 ${r.g.left}일` : ''}. 체력과 운동 습관에 맞춰 이번 주 운동 계획을 만들었어요.</p>
   <div class="goal-chips a3">${plan.goals.map(x => `<span>${x}</span>`).join('')}</div>
   <dl class="ov a4">
    <div><dt>강도</dt><dd>${L.rpe}<span class="sub">${L.talk}</span></dd></div>
    <div><dt>허리 운동</dt><dd>${r.limited ? '호흡·스트레칭 10분' : `1회 ${r.coreMin}분`}</dd></div>
    <div><dt>주간 운동량</dt><dd>${goal}</dd></div>
    <div><dt>프로그램</dt><dd>${r.P.kicker} (${r.P.weeks}주)</dd></div>
   </dl>
  </div></section>
  <div class="wrap d-body">
   ${r.limited ? `<div class="stop"><div class="stop-h"><span class="stop-ic">${ALERT}</span><h3>운동 전에 담당 의사와 먼저 상의하세요</h3></div><p>운동 제한을 들었다면 의사가 허락한 범위 안에서만 운동해야 해요. 아래에는 대부분 부담이 적은 호흡과 스트레칭만 담았어요.</p></div>` : ''}
   <section class="blk"><h2 class="disp">이번 주 계획</h2>
    <ol class="wkg">${r.week.map(d => `<li class="wd ${d.k}"><span class="dn">${d.d}</span><b>${d.t}</b>${d.m ? `<span>${d.m}</span>` : ''}</li>`).join('')}</ol>
    ${r.limited ? '' : `<p class="intro">2주 동안 몸이 적응하면 걷기 시간을 5분씩 늘려, 주 150분(미국산부인과학회 권장)에 가까워지도록 해요.</p>`}
   </section>
   <section class="blk"><h2 class="disp">허리 운동 루틴</h2>
    ${r.phases.map(ph => `<div class="rxg"><h3>${ph.name}</h3><ol class="rxl">${ph.items.map(e => { k++; return `
     <li class="rx"><span class="ex-no">${pad(k)}</span><div>
      <b>${e.n}</b><span class="rx-m">${e.pos} · ${dose(e.dose)}</span>
      ${r.lv === 1 && e.easy ? `<span class="rx-v e">쉬운 단계로 · ${e.easy}</span>` : ''}
      ${r.lv === 3 && e.hard ? `<span class="rx-v h">익숙해지면 · ${e.hard}</span>` : ''}
      ${e.caution ? `<span class="rx-v c">주의 · ${e.caution}</span>` : ''}
      <details><summary>방법 보기</summary><ol>${li(e.how)}</ol></details>
     </div></li>`; }).join('')}</ol></div>`).join('')}
   </section>
   <section class="blk"><h2 class="disp">나에게 맞춘 주의사항</h2><div class="note"><ul>${li(r.notes)}</ul></div></section>
   ${STOP}
   <div class="cta rs-act">
    <button type="button" class="btn pri" data-go="${r.tri}">${r.P.kicker} 전체 운동 보기${ARROW}</button>
    <button type="button" class="btn sec" data-print>저장·인쇄하기</button>
    <button type="button" class="btn sec" data-qz="edit">입력 다시 하기</button>
   </div>
  </div></div>`;
}

/* ---------- 화면 전환 ---------- */
const ORDER = ['cause','symptom','consider','early','mid','late'];
const TITLES = {cause:'요통 유발원인',symptom:'주요 증상',consider:'운동 시 고려사항',early:'임신 초기 프로그램',mid:'임신 중기 프로그램',late:'임신 후기 프로그램'};
const NAV = [['home','처음'],['plan','맞춤 프로그램'],['early','초기'],['mid','중기'],['late','후기'],['cause','알아두기']];
const app = document.getElementById('app'), nav = document.getElementById('nav');
const siteLinks = document.querySelectorAll('.site-nav a');
const triOf = w => w <= 13 ? 'early' : (w <= 27 ? 'mid' : 'late');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;


function countUp(){
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0);
    if(reduce){ el.textContent = to.toFixed(dec); return; }
    const t0 = performance.now(), dur = 1400;
    const tick = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (to * e).toFixed(dec);
      if(p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function show(id){
  if(!PAGES[id] && !PROGS[id] && id !== 'plan') id = 'home';
  document.body.classList.remove('quiz-mode');
  nav.innerHTML = NAV.map(n => `<button type="button" class="pill${n[0]===id?' on':''}" data-go="${n[0]}"${n[0]===id?' aria-current="page"':''}>${n[1]}</button>`).join('');
  siteLinks.forEach(a => a.dataset.go === id ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  if(id === 'home'){
    app.innerHTML = homeHTML(); countUp();
  } else if(id === 'plan'){
    renderPlan(); return;
  } else {
    const i = ORDER.indexOf(id), prev = i < 0 ? null : ORDER[i-1], next = i < 0 ? null : ORDER[i+1];
    const body = PROGS[id] ? progHTML(id) : PAGES[id].html();
    app.innerHTML = `<div class="view-in">${body}</div>
     <div class="wrap"><div class="pager">
      ${prev?`<button type="button" data-go="${prev}">← ${TITLES[prev]}</button>`:'<span></span>'}
      ${next?`<button type="button" data-go="${next}">${TITLES[next]} →</button>`:''}
     </div></div>`;
  }
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if(j){ e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth'}); return; }
  const s = e.target.closest('[data-scroll]');
  if(s){ document.getElementById(s.dataset.scroll)?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center'}); return; }
  const o = e.target.closest('[data-k]');
  if(o){ plan[o.dataset.k] = o.dataset.v; savePlan(); renderQ(); return; }
  const m = e.target.closest('[data-m]');
  if(m){ const key = m.dataset.m, v = m.dataset.v; plan[key] = plan[key].includes(v) ? plan[key].filter(x => x !== v) : plan[key].concat(v); savePlan(); renderQ(); return; }
  const q = e.target.closest('[data-qz]');
  if(q){
    const a = q.dataset.qz;
    if(a === 'prev') qGo(-1);
    else if(a === 'next') qGo(1);
    else if(a === 'edit'){ qDone = false; qStep = 0; renderPlan(); }
    return;
  }
  if(e.target.closest('[data-print]')){ window.print(); return; }
  const b = e.target.closest('[data-go]'); if(!b) return;
  const id = b.dataset.go;
  if(id === 'home'){ try { history.replaceState(null, '', location.pathname + location.search); } catch(_){} show('home'); }
  else if(location.hash === '#' + id) show(id);
  else location.hash = id;
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.dataset && e.target.dataset.f){ e.preventDefault(); qGo(1); } });
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if(!f) return;
  plan[f] = e.target.value.trim(); savePlan(); refreshQ();
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

qDone = STEPS.every(s => s.ok());
show(location.hash.slice(1));
</script>
